# Describes how each service will be handled
services:
  nginx:
    build:
      context: .
      dockerfile: requirements/nginx/Dockerfile
    container_name: nginx
    ports:
      - "8443:443"
    depends_on:
      - wordpress
    volumes:
      - wp-volume:/var/www/wordpress
      - ./requirements/nginx/conf/:/etc/nginx/http.d/
      - ./requirements/nginx/tools:/etc/nginx/ssl/
    restart: always
    networks:
      - inception

  mariadb:
    build:
      context: .
      dockerfile: requirements/mariadb/Dockerfile
      args:
        - DB_NAME
        - DB_USER
        - DB_PASS
        - DB_ROOT
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - db-volume:/var/lib/mysql
    restart: always
    networks:
      - inception

  wordpress:
    build:
      context: .
      dockerfile: requirements/wordpress/Dockerfile
      args:
        - DB_NAME
        - DB_USER
        - DB_PASS
    container_name: wordpress
    env_file:
      - .env
    volumes:
      - wp-volume:/var/www/wordpress
    depends_on:
      - mariadb
    restart: always
    networks:
      - inception

networks:
    inception:
        driver: bridge

volumes:
  wp-volume:
    driver_opts:
      o: bind
      type: none
      device: /nfs/homes/julberna/goinfre/data/wordpress

  db-volume:
    driver_opts:
      o: bind
      type: none
      device: /nfs/homes/julberna/goinfre/data/mariadb
